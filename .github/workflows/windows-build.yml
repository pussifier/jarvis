name: Build JARVIS for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: |
            release/JARVIS-*-Windows-Setup.exe
            release/JARVIS-*-Windows-x64.zip
          if-no-files-found: error
